<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030a1a" />
    <meta
      name="description"
      content="Fly a saucer through an asteroid belt and fight other players."
    />
    <!-- Added to an iPhone's Home Screen, the game opens without Safari's bars. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Orbit Runner</title>
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Orbit Runner"></canvas>

    <!-- The cockpit view: the canopy's frame, and a mark where the nose points. -->
    <svg id="cockpit" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" hidden>
      <path class="frame" d="M0 0H100V100H0Z M0 12 Q50 -4 100 12 V78 Q50 96 0 78Z" />
      <path
        class="strut"
        d="M0 12 Q50 -4 100 12 M100 78 Q50 96 0 78 M30 2.5 L26 89 M70 2.5 L74 89"
      />
      <svg
        x="50"
        y="50"
        width="1"
        height="1"
        overflow="visible"
        preserveAspectRatio="xMidYMid meet"
      >
        <path class="reticle" d="M-3.2 0H-1.2 M1.2 0H3.2 M0 -3.2V-1.2 M0 1.2V3.2" />
        <circle class="reticle" r="0.25" />
      </svg>
    </svg>

    <div id="hud">
      <div id="gauges">
        <div class="bar" id="xp-bar" role="meter" aria-label="Experience">
          <div class="fill" id="xp-fill"></div>
          <span id="xp"></span>
          <b id="xp-gain"></b>
        </div>
        <div class="bar" id="hull-bar" role="meter" aria-label="Hull">
          <div class="fill" id="hull-fill"></div>
          <span id="hull"></span>
        </div>
        <div class="bar" id="shield-bar" role="meter" aria-label="Shield">
          <div class="fill" id="shield-fill"></div>
          <span id="shield"></span>
        </div>
        <div class="bar" id="energy-bar" role="meter" aria-label="Energy">
          <div class="fill" id="energy-fill"></div>
          <span id="energy"></span>
        </div>
        <div id="speed"></div>
        <div id="ammo"></div>
        <div id="homing"></div>
        <div id="points"></div>
        <div id="kills"></div>
        <div id="timers"></div>
      </div>

      <div id="corner">
        <canvas id="minimap" width="160" height="160" aria-label="Map"></canvas>
        <div id="mission" aria-live="polite">
          <div id="mission-text"></div>
          <div class="bar" id="mission-bar" role="meter" aria-label="Mission">
            <div class="fill" id="mission-fill"></div>
            <span id="mission-count"></span>
          </div>
        </div>
        <ol id="scoreboard" aria-label="Scoreboard"></ol>
      </div>

      <div id="status" role="status" aria-live="polite"></div>
      <div id="boss" hidden>
        <div id="boss-name"></div>
        <div class="bar" id="boss-bar" role="meter" aria-label="The Warlock">
          <div class="fill" id="boss-fill"></div>
        </div>
      </div>
      <div id="banner" role="status" hidden>
        <h2 id="banner-title"></h2>
        <p id="banner-detail"></p>
      </div>
      <div id="warning" role="alert"></div>
      <ul id="feed" aria-live="polite"></ul>
      <div id="labels" aria-hidden="true"></div>

      <div id="store" hidden>
        <h2>Store <span id="store-time"></span></h2>
        <button type="button" data-item="hp"><b>1</b> Repair hull <i>1,500</i></button>
        <button type="button" data-item="shield"><b>2</b> Full shield <i>1,000</i></button>
        <button type="button" data-item="fenix"><b>3</b> Fenix <i>2,000</i></button>
      </div>

      <div id="death" hidden>
        <h2 id="death-title"></h2>
        <p id="death-detail"></p>
        <p id="death-best"></p>
        <p id="death-respawn"></p>
      </div>

      <div id="help"></div>

      <div id="touch" hidden>
        <div id="stick" hidden><div id="knob"></div></div>
        <button type="button" id="faster" aria-label="Faster">▲</button>
        <button type="button" id="slower" aria-label="Slower">▼</button>
        <button type="button" id="fire" aria-label="Fire">FIRE</button>
        <button type="button" id="heavy" aria-label="Heavy shot">HVY</button>
        <button type="button" id="seek" aria-label="Homing shot: hold, then let go">HOM</button>
      </div>

      <button type="button" id="settings-button" aria-label="Settings" aria-expanded="false">
        ⚙
      </button>
      <div id="settings" hidden>
        <label><input type="checkbox" id="invert-pitch" /> Invert pitch</label>
        <label id="tilt-row"><input type="checkbox" id="tilt" /> Tilt the phone to steer</label>
        <div id="pad">
          <p id="pad-status" role="status"></p>
          <dl id="pad-layout"></dl>
        </div>
        <div id="claim">
          <button type="button" id="claim-button">Claim salvage crates</button>
          <p id="claim-text" role="status"></p>
        </div>
      </div>

      <div id="rotate"><p>Turn your phone sideways to fly.</p></div>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
