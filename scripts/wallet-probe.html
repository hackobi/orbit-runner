<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallet probe</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 720px;
        margin: 32px auto;
        padding: 0 16px;
        background: #0b1020;
        color: #e6ebff;
      }
      button {
        font: inherit;
        padding: 10px 18px;
        margin: 0 8px 8px 0;
      }
      textarea {
        width: 100%;
        height: 360px;
        font:
          13px/1.4 ui-monospace,
          monospace;
        background: #050814;
        color: #cfe;
        border: 1px solid #334;
      }
    </style>
  </head>
  <body>
    <h1>Wallet probe</h1>
    <p>
      Step 5a of the wallet link. It asks the Demos extension to connect and to sign one line of
      text, and shows what comes back. It sends nothing anywhere and asks for no payment. Press the
      buttons in order, approve in the extension, then copy the box.
    </p>
    <button id="find">1. Find the wallet</button>
    <button id="connect" disabled>2. Connect</button>
    <button id="sign" disabled>3. Sign the test line</button>
    <button id="copy">Copy the box</button>
    <textarea id="out" readonly></textarea>
    <script type="module">
      // Dev only: served by `npm run dev` at /scripts/wallet-probe.html, never built into the game.
      const ANNOUNCE = ['demosAnnounceProvider', 'demosProviderReady'];
      const report = { page: location.origin, userAgent: navigator.userAgent, steps: [] };
      const out = document.getElementById('out');
      const button = (id) => document.getElementById(id);
      let provider = null;
      let address = '';

      const show = () => {
        out.value = JSON.stringify(report, null, 2);
      };
      const note = (step, value) => {
        report.steps.push({ step, ...value });
        show();
      };
      /** What a reply looks like, without cutting anything: a signature and an address are public. */
      const plain = (value) => {
        try {
          return JSON.parse(JSON.stringify(value ?? null));
        } catch {
          return String(value);
        }
      };
      const ask = async (step, request) => {
        try {
          const reply = await provider.request(request);
          note(step, { request, reply: plain(reply) });
          return reply;
        } catch (error) {
          note(step, { request, error: String(error?.message ?? error) });
          return null;
        }
      };
      /** The first string under any of these names, however deep the reply nests it. */
      const dig = (value, names, depth = 0) => {
        if (!value || typeof value !== 'object' || depth > 5) return '';
        for (const name of names)
          if (typeof value[name] === 'string' && value[name]) return value[name];
        for (const inner of Object.values(value)) {
          const found = dig(inner, names, depth + 1);
          if (found) return found;
        }
        return '';
      };

      const found = (candidate, how) => {
        if (provider || !candidate || typeof candidate.request !== 'function') return;
        provider = candidate;
        const methods = [];
        for (let o = candidate; o && o !== Object.prototype; o = Object.getPrototypeOf(o)) {
          for (const key of Object.getOwnPropertyNames(o)) {
            if (typeof candidate[key] === 'function' && key !== 'constructor') methods.push(key);
          }
        }
        note('find', { how, methods: [...new Set(methods)].sort() });
        button('connect').disabled = false;
      };
      for (const name of ANNOUNCE) {
        window.addEventListener(name, (event) => {
          found(event.detail?.provider ?? event.detail, `event ${name}`);
        });
      }

      button('find').onclick = () => {
        found(window.demos, 'window.demos');
        window.dispatchEvent(new Event('demosRequestProvider'));
        setTimeout(() => {
          if (!provider)
            note('find', {
              error: 'No wallet answered within 3 s. Is the extension on for this page?',
            });
        }, 3000);
      };

      button('connect').onclick = async () => {
        const reply = await ask('connect', { method: 'connect' });
        address =
          typeof reply === 'string' ? reply : dig(reply, ['address', 'publicKey', 'account']);
        note('address', { address });
        button('sign').disabled = !address;
      };

      button('sign').onclick = async () => {
        const nonce = [...crypto.getRandomValues(new Uint8Array(8))].map((b) =>
          b.toString(16).padStart(2, '0'),
        );
        const message = `Orbit Runner fort link test ${nonce.join('')}`;
        note('message', { message });
        // The old game's two calls, in its order. Whichever answers is the one to build on.
        const first = await ask('sign', { method: 'sign', params: [message] });
        if (!first)
          await ask('personal_sign', { method: 'personal_sign', params: [message, address] });
      };

      button('copy').onclick = async () => {
        await navigator.clipboard.writeText(out.value);
      };
      show();
    </script>
  </body>
</html>
